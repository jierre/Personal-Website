<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Intel+One+Mono:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename = 'css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename = 'css/slider.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename = 'css/cert.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename = 'css/try.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename = 'css/nav.css') }}">
     <link rel="stylesheet" href="{{ url_for('static', filename = 'css/chat.css') }}">
    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <title>John Pierre</title>
</head>
<body>
    <header class="top-header">
        <span class="brand-name">John Pierre</span>
        <button class="menu-toggle" onclick="toggleNav()" aria-label="Toggle Menu">☰</button>
    </header>

    <!-- 2. Dark Overlay Backdrop (for mobile) -->
    <div id="nav-overlay" class="nav-overlay" onclick="toggleNav()"></div>
    
    <div class = "page-layout">
        <nav id="nav-bar-container" class = "nav-bar-container reveal">
            <div class = "nav-bar nav-top">
                <a href="#home" class="nav-brand redirect">
                    <span class="brand-initials">JP</span>
                </a>
                    
                    <!-- Live Availability Status -->
                <div class="status-badge">
                    <span class="status-dot"></span>
                    <span class="status-text">Available for work</span>
                </div>

                    <!-- Top Chat Action Button -->

                <button class="chat-btn" onclick="toggleChat(event)" >
                    <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <span> Let's Talk!</span>
                </button>
            </div>

            <div class = "nav-bar nav-middle">
                <span class="nav-label">NAVIGATE</span>
                <ul class="nav-menu">
                    <li><a class="nav-item redirect" href="#home"><span class="nav-num">01</span>Home</a></li>
                    <li><a class="nav-item redirect" href="#about"><span class="nav-num">02</span>About</a></li>
                    <li><a class="nav-item redirect" href="#experience"><span class="nav-num">03</span>Experience</a></li>
                    <li><a class="nav-item redirect" href="#projects"><span class="nav-num">04</span>Projects</a></li>
                    <li><a class="nav-item redirect" href="#skills"><span class="nav-num">05</span>Stack</a></li>
                    <li><a class="nav-item redirect" href="#certifications"><span class="nav-num">06</span>Certs</a></li>
                </ul>
            </div>
            
            <div class = "nav-bar nav-bottom">
                <a href="#" target="_blank" class="resume-btn">
                    <svg class="nav-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                    </svg>
                    <span>Resume</span>
                </a>

                <div class="nav-social-icons">

                    <a href="https://github.com/jlpampilonpacs-art" target="_blank" aria-label="GitHub">
                        <svg class="nav-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
                        </svg>
                    </a>

                    <a href="https://linkedin.com" target="_blank" aria-label="LinkedIn">
                        <svg class="nav-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
                            <rect x="2" y="9" width="4" height="12"></rect>
                            <circle cx="4" cy="4" r="2"></circle>
                        </svg>
                    </a>

                    <a href="https://www.instagram.com/jpzz.zr/" target="_blank" aria-label="Instagram">
                        <svg class="nav-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                        </svg>
                    </a>
                </div>
            </div>
        </nav>
        
        <main class="main-content">
            {% block content %}
            <!-- Dynamic page content goes here -->
            {% endblock %}
        </main>
    </div>
        {% block scripts %}{% endblock %}
</body>
</html>
